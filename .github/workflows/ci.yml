name: CI

# Every unit test and the release build, on a Mac with Apple silicon, the only computer the
# speech recognition runs on, and on Linux, where the tests that need the Mac skip and the
# worker tests run against their stub library. The build typechecks first, so there is no
# separate typecheck step.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch or pull request cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      # The other computer's result is still wanted when one of them fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7 # v5
        with:
          # Nothing here pushes: the token has no business in .git/config while packages run.
          persist-credentials: false
      - uses: pnpm/action-setup@v4 # v4
      - uses: actions/setup-node@v5 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Before the tests: a test reads the built stylesheet and skips without it.
      - run: pnpm build
      - name: Test
        shell: bash
        env:
          OS: ${{ matrix.os }}
        # Reading a job's log takes admin rights on the repository; annotations are public. The
        # runner's summary of failing tests goes out as annotations, 40 lines each.
        run: |
          set -o pipefail
          if pnpm test 2>&1 | tee test.log; then exit 0; fi
          sed -n '/failing tests:/,$p' test.log | head -160 > failures.txt
          split -l 40 failures.txt part-
          for part in part-*; do
            body=$(sed 's/%/%25/g; s/\r//g' "$part" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Failing tests ($OS, ${part#part-})::${body}"
          done
          exit 1
